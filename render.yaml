# Render Blueprint: một Web Service (Node) phục vụ cả API lẫn giao diện đã build.
# Xem DEPLOY.md để biết các bước triển khai.
services:
  - type: web
    name: paperfinder
    runtime: node
    plan: free
    # --include=dev vì bước build cần TypeScript, Vite, tsup (devDependencies).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # Endpoint nhẹ, không gọi tới API học thuật. UptimeRobot cũng nên ping địa chỉ này.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      # Các giá trị bí mật: điền trong Render Dashboard (không ghi vào file này).
      - key: OPENALEX_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      # Mật khẩu trang /admin (thống kê sử dụng). Không điền = trang admin bị tắt.
      - key: ADMIN_PASSWORD
        sync: false
      # --- Tài khoản và gói Pro (tùy chọn; xem DEPLOY.md mục 7). Không điền SESSION_SECRET = tắt tài khoản. ---
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      # Nhận thanh toán chuyển khoản qua SePay (DEPLOY.md mục 7.3). Thiếu KEY/BANK_ACCOUNT/BANK_NAME = nút thanh toán bị tắt.
      - key: SEPAY_API_KEY
        sync: false
      - key: SEPAY_BANK_ACCOUNT
        sync: false
      - key: SEPAY_BANK_NAME
        sync: false
      - key: SEPAY_ACCOUNT_NAME
        sync: false
      - key: SEPAY_ACCOUNT_ALIASES
        sync: false
      - key: SEPAY_CODE_PREFIX
        value: PF
      # Gửi email quên mật khẩu (DEPLOY.md mục 7.5). Thiếu SMTP_HOST/SMTP_FROM/PUBLIC_BASE_URL = tắt tính năng quên mật khẩu.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
